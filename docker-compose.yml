# ==============================================================================
# YHealth Speaker Fleet Management Dashboard - Production Docker Compose
# Configured for KVM2 Server with Nginx SSL, WebSockets, & Auto-Certbot
# ==============================================================================

services:
  # 1. Core Fleet Dashboard Application (FastAPI Backend + React 18 SPA)
  dashboard:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: yhealth-fleet-dashboard
    restart: always
    expose:
      - "8010"
    environment:
      - DASHBOARD_MODE=production
      - PYTHONUNBUFFERED=1
    volumes:
      - ./backend/fleet_db.json:/app/backend/fleet_db.json
      - ./backend/users_db.json:/app/backend/users_db.json
    networks:
      - fleet-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8010/api/speakers"]
      interval: 20s
      timeout: 5s
      retries: 3
      start_period: 10s

  # 2. Production Nginx Reverse Proxy with TLS 1.2/1.3 & WebSocket Support
  nginx:
    image: nginx:1.25-alpine
    container_name: yhealth-fleet-nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./ssl:/etc/nginx/ssl:ro
      - ./certbot/conf:/etc/letsencrypt:ro
      - ./certbot/www:/var/www/certbot:ro
    depends_on:
      dashboard:
        condition: service_healthy
    networks:
      - fleet-net

  # 3. Automated Let's Encrypt Certificate Renewal Agent
  certbot:
    image: certbot/certbot:latest
    container_name: yhealth-certbot
    restart: unless-stopped
    volumes:
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew --quiet; sleep 12h & wait $${!}; done;'"
    networks:
      - fleet-net

networks:
  fleet-net:
    driver: bridge
